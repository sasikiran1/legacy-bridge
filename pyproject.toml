[project]
name = "legacy-bridge"
version = "0.1.0"
description = "API-first agent with browser fallback and a reversible PII proxy"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cryptography>=50.0.2",
    "en-core-web-lg",
    "faker>=40.43.0",
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.0",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=2.3.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "playwright>=1.64.0",
    "polars>=2.0.0",
    "presidio-analyzer[gliner]>=2.2.364",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12",
]

[tool.uv]
package = false

# CPU-only torch: the default PyPI wheel bundles CUDA libraries (several GB) that the proxy does not need.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["portal"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "N", "S"]
ignore = ["S101", "S311", "RUF001", "RUF003", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["testbed", "proxy", "analysis", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "oracle: drives the running portal stack with Playwright (needs `docker compose up`)",
    "models: loads the spaCy and GLiNER detection models (slow first run; downloads ~1.2 GB)",
    "redis: needs the Redis service (REDIS_URL)",
]
addopts = "-m 'not oracle and not models and not redis'"
