name: legacy-bridge

x-python: &python
  build:
    context: .
    dockerfile: deploy/python.Dockerfile
  volumes:
    - .:/repo
    - hf-cache:/cache/hf

x-proxy-env: &proxy-env
  REDIS_URL: redis://redis:6379/0
  VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:?set in .env}
  VAULT_TASK_TTL_SECONDS: ${VAULT_TASK_TTL_SECONDS:-3600}
  TOKEN_KEY: ${TOKEN_KEY:?set in .env}
  RUN_SEED: ${RUN_SEED:-7}

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: portal
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d portal"]
      interval: 2s
      timeout: 3s
      retries: 30

  portal:
    build: ./portal
    environment:
      PORTAL_JDBC_URL: jdbc:postgresql://postgres:5432/portal
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PORTAL_ADMIN_TOKEN: ${PORTAL_ADMIN_TOKEN:?set in .env}
      PORTAL_TEST_USER_PASSWORD: ${PORTAL_TEST_USER_PASSWORD:?set in .env}
      PORTAL_DETERMINISTIC: ${PORTAL_DETERMINISTIC:-true}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Token→value vault (ADR 0002). Values arrive already AES-GCM encrypted, so the AOF holds only ciphertext.
  redis:
    image: redis:8.10.2
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  proxy:
    <<: *python
    command: ["uv", "run", "uvicorn", "proxy.app:app", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      <<: *proxy-env
      AUDIT_LOG_PATH: /repo/.cache/audit/proxy.jsonl
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_URL:-http://host.docker.internal:11434/v1}
      LLM_MODE: ${LLM_MODE:-replay}
      LOCAL_TEXT_MODEL: ${LOCAL_TEXT_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy

  # Trace UI for the agent's OpenTelemetry spans (ADR 0006): http://localhost:6006
  phoenix:
    image: arizephoenix/phoenix:version-20.24.0
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    ports:
      - "127.0.0.1:6006:6006"
    volumes:
      - phoenix-data:/mnt/data

  # Python checks, tests, oracles and analysis: `docker compose --profile test run --rm testbed uv run pytest`
  testbed:
    <<: *python
    profiles: ["test"]
    environment:
      <<: *proxy-env
      PORTAL_BASE_URL: http://portal:8080
      PORTAL_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/portal
      PORTAL_ADMIN_TOKEN: ${PORTAL_ADMIN_TOKEN}
      PORTAL_TEST_USER_PASSWORD: ${PORTAL_TEST_USER_PASSWORD}
      PROXY_URL: http://proxy:8090
      AGENT_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/agent
      AGENT_PROFILE: ${AGENT_PROFILE:-local}
      INJECTION_SCANNER: ${INJECTION_SCANNER:-none}
      HF_TOKEN: ${HF_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${AGENT_OTLP_ENDPOINT:-}
    shm_size: 1gb
    depends_on:
      portal:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  hf-cache:
  phoenix-data:
