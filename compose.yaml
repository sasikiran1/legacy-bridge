name: legacy-bridge

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: portal
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d portal"]
      interval: 2s
      timeout: 3s
      retries: 30

  portal:
    build: ./portal
    environment:
      PORTAL_JDBC_URL: jdbc:postgresql://postgres:5432/portal
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PORTAL_ADMIN_TOKEN: ${PORTAL_ADMIN_TOKEN:?set in .env}
      PORTAL_TEST_USER_PASSWORD: ${PORTAL_TEST_USER_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Python checks and the oracle suite: `docker compose --profile test run --rm testbed uv run pytest`
  testbed:
    profiles: ["test"]
    build:
      context: .
      dockerfile: deploy/testbed.Dockerfile
    environment:
      PORTAL_BASE_URL: http://portal:8080
      PORTAL_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/portal
      PORTAL_ADMIN_TOKEN: ${PORTAL_ADMIN_TOKEN}
      PORTAL_TEST_USER_PASSWORD: ${PORTAL_TEST_USER_PASSWORD}
    volumes:
      - .:/repo
    shm_size: 1gb
    depends_on:
      portal:
        condition: service_started

volumes:
  postgres-data:
